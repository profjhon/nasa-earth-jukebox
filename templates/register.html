
{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg p-4">
            <h3 class="text-center mb-3">Registro de Explorador</h3>
            <p class="text-secondary text-center small">Crea tu cuenta para generar y escuchar pistas ambientales</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Tu nombre" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="usuario123" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Crear Cuenta</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-info small">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
