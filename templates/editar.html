{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow">
            <h4 class="mb-3 text-warning"><i class="bi bi-pencil-square"></i> Editar Pista Terrestre</h4>
            <form method="POST">
                <div class="mb-2">
                    <label class="form-label">Título</label>
                    <input type="text" name="titulo" class="form-control" value="{{ pista.titulo }}" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">Fenómeno Climático</label>
                    <input type="text" name="fenomeno" class="form-control" value="{{ pista.fenomeno }}" required>
                </div>
                <div class="mb-2">
                    <label class="form-label">URL Imagen NASA EIC</label>
                    <input type="url" name="url_imagen" class="form-control" value="{{ pista.url_imagen }}" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Frecuencia (Hz)</label>
                        <input type="number" step="0.01" name="frecuencia_hz" class="form-control" value="{{ pista.frecuencia_hz }}" required>
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Tipo de Onda</label>
                        <select name="tipo_onda" class="form-select">
                            <option value="sine" {% if pista.tipo_onda == 'sine' %}selected{% endif %}>Senoidal</option>
                            <option value="triangle" {% if pista.tipo_onda == 'triangle' %}selected{% endif %}>Triangular</option>
                            <option value="sawtooth" {% if pista.tipo_onda == 'sawtooth' %}selected{% endif %}>Sierra</option>
                            <option value="square" {% if pista.tipo_onda == 'square' %}selected{% endif %}>Cuadrada</option>
                        </select>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label">Intensidad (%)</label>
                    <input type="number" name="intensidad" class="form-control" value="{{ pista.intensidad }}" min="10" max="100" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" required>{{ pista.descripcion }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning w-50 fw-bold">Actualizar</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary w-50">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
